name: Build and Push user-service

on:
  push:
    branches:
      - main
      - qa
  # PR 에서도 테스트만 돈다. 이미지 빌드·푸시는 아래 job 의 if 로 push 에만 묶는다.
  pull_request:

# API 주소 등 환경 값은 빌드가 아니라 컨테이너 기동 시점에
# compose 의 environment 로 주입된다 (entrypoint.sh 가 config.js 를 치환).
env:
  ORG_NAME: hufs-hexagon-talent
  PROJECT_NAME: study-room-reservation
  SERVICE_NAME: user-app

jobs:
  # 이미지를 만들기 전에 jest 를 돌린다. 테스트가 깨진 커밋은 qa·main 어느 쪽에도 배포되지 않는다.
  # 노드 버전은 Dockerfile 의 빌드 스테이지(node:20)와 맞춘다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: CI=true yarn test --watchAll=false

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.ORG_NAME }}/${{ env.PROJECT_NAME }}-${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/{1}-{2}:latest', env.ORG_NAME, env.PROJECT_NAME, env.SERVICE_NAME) || '' }}
            ${{ github.ref == 'refs/heads/qa' && format('ghcr.io/{0}/{1}-{2}:qa', env.ORG_NAME, env.PROJECT_NAME, env.SERVICE_NAME) || '' }}
          platforms: linux/amd64 #, linux/arm64/v8
