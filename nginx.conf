# /etc/nginx/nginx.conf 전체를 교체하는 설정.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # TLS 는 앞단 nginx-proxy 가 종단한다. 리다이렉트는 상대 경로로 보낸다.
        absolute_redirect off;

        # 이미 발송된 관리자 메일에 /backoffice/inquiries/{id} 링크가 남아 있어
        # 그 링크를 살려 둔다. 뒷부분을 그대로 붙여 /admin 으로 넘긴다
        # (/backoffice -> /admin, /backoffice/inquiries/412 -> /admin/inquiries/412).
        # 아래 /admin 블록보다 먼저 걸려야 해서 정규식 location 을 쓴다.
        # 접두만 겹치는 /backofficeXYZ 는 일부러 잡지 않는다 — 쓰인 적 없는 주소다.
        location ~ ^/backoffice(/.*)?$ {
            return 301 /admin$1$is_args$args;
        }

        # admin-app 컨테이너가 내려간 동안 nginx-proxy 가 /admin location 을
        # 제거해 이 앱이 200 으로 받게 된다(장애 은폐). 그때만 503 을 낸다 —
        # 정상 운영 중에는 nginx-proxy 가 admin-app 으로 먼저 라우팅해 이 블록에 오지 않는다.
        # 이 앱의 관리자 화면은 /manage 로 옮겨서 여기에 걸리지 않는다.
        location /admin {
            return 503;
        }

        # 해시가 붙은 빌드 산출물: 내용이 바뀌면 파일명이 바뀌므로 영구 캐시.
        # 없는 파일을 index.html 로 가리면 옛 HTML 이 JS 자리에 HTML 을 받아
        # 빈 화면이 되므로 반드시 404 를 낸다.
        location /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 그 외 전부(index.html, config.js, public 자산, SPA 라우트 경로)는
        # 캐시하지 않는다. 라우트 경로는 index.html 로 fallback 한다.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}

events {}
